let theme=localStorage.getItem('twelveTheme')||'cute',sound=localStorage.getItem('twelveSound')!=='off',musicOn=localStorage.getItem('twelveMusic')!=='off',sfxVolume=Number(localStorage.getItem('twelveSfxVolume')??'80')/100,musicVolume=Number(localStorage.getItem('twelveMusicVolume')??'70')/100,vibration=localStorage.getItem('twelveVibration')!=='off';document.body.className=theme;

function scheduleAmbient(){if(!musicOn||!musicCtx||musicCtx.state==='closed')return;const now=musicCtx.currentTime,chord=ambientChords[musicStep%ambientChords.length];chord.forEach((f,i)=>musicNote(musicCtx,f/2,now+i*.1,3.6,.024));musicNote(musicCtx,chord[2],now+1.5,1.6,.012);musicStep++;}
function startMusic(){if(!musicOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!musicCtx){musicCtx=new AC();musicGain=musicCtx.createGain();musicGain.gain.value=.42*musicVolume;musicGain.connect(musicCtx.destination);}if(musicCtx.state==='suspended')musicCtx.resume().catch(()=>{});if(!musicTimer){scheduleAmbient();musicTimer=setInterval(scheduleAmbient,3800);}}catch(e){}}

// Wooden piece placement: short double clack, synthesized locally (no external audio file).
let pieceAudioCtx=null;
function piecePlaceSound(){
 if(!sound)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!pieceAudioCtx||pieceAudioCtx.state==='closed')pieceAudioCtx=new AC();
  if(pieceAudioCtx.state==='suspended')pieceAudioCtx.resume().catch(()=>{});
  const ctx=pieceAudioCtx,rate=ctx.sampleRate;
  function knock(delay,volume,pitch){
   const count=Math.max(1,Math.floor(rate*.045));
   const buffer=ctx.createBuffer(1,count,rate),data=buffer.getChannelData(0);
   for(let i=0;i<count;i++){
    const t=i/rate;
    data[i]=((Math.random()*2-1)*.55+Math.sin(2*Math.PI*pitch*t)*.45)*Math.exp(-t*115);
   }
   const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
   source.buffer=buffer;filter.type='lowpass';filter.frequency.value=1150;
   gain.gain.value=volume*sfxVolume;
   source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
   source.start(ctx.currentTime+delay);
  }
  knock(0,.52,310);knock(.027,.22,235);
 }catch(e){}
}
function initial(){let b=Array(12).fill(null);b[0]={t:'G',o:1};b[1]={t:'K',o:1};b[2]={t:'E',o:1};b[4]={t:'P',o:1};b[7]={t:'P',o:0};b[9]={t:'E',o:0};b[10]={t:'K',o:0};b[11]={t:'G',o:0};return {b,h:[[],[]],turn:0,tryOwner:null,tryPending:false};}
function ownerForward(o){return o===0?-1:1}function directions(p){return DIR[p.t].map(([dr,dc])=>[dr*(p.o===0?-1:1),dc]);}
function moves(s,o){let out=[];for(let i=0;i<12;i++){let p=s.b[i];if(!p||p.o!==o)continue;let r=Math.floor(i/3),c=i%3;for(let [dr,dc] of directions(p)){let nr=r+dr,nc=c+dc;if(nr<0||nr>3||nc<0||nc>2)continue;let j=nr*3+nc,q=s.b[j];if(!q||q.o!==o)out.push({from:i,to:j});}}for(let k=0;k<s.h[o].length;k++){let t=s.h[o][k];for(let j=0;j<12;j++){if(s.b[j])continue;let r=Math.floor(j/3);if(t==='P'&&r===(o===0?0:3))continue;out.push({drop:k,to:j});}}return out;}
function apply(s,m){s=copy(s);let o=s.turn,p;if(m.drop!==undefined){let t=s.h[o].splice(m.drop,1)[0];p={t,o};s.b[m.to]=p;}else{p=s.b[m.from];let taken=s.b[m.to];if(taken&&taken.t!=='K')s.h[o].push(taken.t==='H'?'P':taken.t);s.b[m.to]=p;s.b[m.from]=null;if(p.t==='P'&&Math.floor(m.to/3)===(o===0?0:3))p.t='H';}
let winner=null;if(!s.b.some(x=>x&&x.t==='K'&&x.o===1-o))winner=o;
// Entering the far rank with a king wins after surviving the opponent's next move.
if(s.tryPending&&s.tryOwner===1-o){let king=s.b.findIndex(x=>x&&x.t==='K'&&x.o===1-o);if(king>=0&&Math.floor(king/3)===((1-o)===0?0:3))winner=1-o;s.tryPending=false;s.tryOwner=null;}
if(p.t==='K'&&Math.floor(m.to/3)===(o===0?0:3)){s.tryOwner=o;s.tryPending=true;}
s.turn=1-o;return {s,winner};}
function evalState(s,side){let v=0,weight={K:300,G:6,E:5,P:3,H:7};for(let i=0;i<12;i++){let p=s.b[i];if(p){let f=p.o===0?3-Math.floor(i/3):Math.floor(i/3);v+=(p.o===side?1:-1)*(weight[p.t]+(p.t==='P'?f*.4:0));}}for(let o=0;o<2;o++)for(let t of s.h[o])v+=(o===side?1:-1)*weight[t]*.85;return v;}
function search(s,depth,alpha,beta,side){let ml=moves(s,s.turn);if(depth===0||!ml.length)return evalState(s,side);let maximize=s.turn===side,best=maximize?-1e6:1e6;for(let m of ml){let a=apply(s,m);let val=a.winner!==null?(a.winner===side?10000+depth:-10000-depth):search(a.s,depth-1,alpha,beta,side);if(maximize){best=Math.max(best,val);alpha=Math.max(alpha,best)}else{best=Math.min(best,val);beta=Math.min(beta,best)}if(beta<=alpha)break;}return best;}
function aiMove(){if(mode!=='ai'||finished||!state||state.turn===me)return;let ml=moves(state,state.turn);if(!ml.length){endRound(me);return;}let depth=[0,1,2,3][difficulty],ranked=ml.map(m=>{let a=apply(state,m);return {m,v:a.winner!==null?10000:depth?search(a.s,depth-1,-1e6,1e6,state.turn):Math.random()*10}});ranked.sort((a,b)=>b.v-a.v);let pool=difficulty===0?ranked: difficulty===1?ranked.slice(0,Math.min(4,ranked.length)):ranked.slice(0,1);commitMove(pool[Math.floor(Math.random()*pool.length)].m);}

const helpPages={
 rules:`<h3>승리 조건</h3><p>상대 왕(王)을 포획하거나 내 왕이 상대 진영 끝줄에 들어간 뒤 상대의 다음 수까지 살아남으면 승리합니다.</p><h3>장기말 이동</h3><p><b>王 왕:</b> 주변 8방향 한 칸<br><b>將 장:</b> 상하좌우 한 칸<br><b>相 상:</b> 대각선 네 방향 한 칸<br><b>子 자:</b> 전진 한 칸. 상대 끝줄 도착 시 侯로 승격<br><b>侯 후:</b> 전후좌우 및 전진 대각선 한 칸</p><h3>포획과 재배치</h3><p>상대 말을 잡으면 내 포로가 됩니다. 포로를 선택하고 빈 칸을 터치하면 한 턴을 사용해 재배치합니다. 후는 포획 시 자로 돌아가며, 자는 상대 끝줄에 바로 내려놓을 수 없습니다.</p><p>내 말을 누르면 이동 가능한 칸과 포획 가능한 상대 말이 강조됩니다.</p>`,
 ai:`<h3>AI 대전 방법</h3><p>① 메인화면에서 <b>AI 대전</b>을 누릅니다.<br>② <b>단판 승부</b> 또는 <b>3판 2선승제</b>를 선택합니다.<br>③ <b>초급·중급·고급·전문가</b> 중 난이도를 선택하면 시작합니다.</p><h3>게임 방식</h3><p>단판 승부는 한 판으로 승부를 결정합니다. 3판 2선승제는 먼저 2승을 거둔 쪽이 최종 승리합니다.</p><p>내 차례에 장기말을 선택한 뒤 이동할 칸을 터치하세요. 잡은 말은 내 포로 영역에서 선택해 재배치할 수 있습니다.</p>`,

};
function helpTab(which,button){const box=$('helpText');if(!box)return;box.innerHTML=helpPages[which]||helpPages.rules;box.scrollTop=0;document.querySelectorAll('.help-tabs button').forEach(b=>b.classList.toggle('active',b===button));}

function showModal(which){let h='';if(which==='exit')h='<h2>정말 나가시겠습니까?</h2><div class="row"><button onclick="closeModal();goHome()">Yes</button><button onclick="closeModal()">No</button></div>';if(which==='settings')h=`<h2>⚙️ 환경설정</h2><p>게임 테마</p><div class="row"><button onclick="setTheme('trad')">🏯 전통 장기말</button><button onclick="setTheme('cute')">🎭 캐릭터 장기말</button></div><p id="themeStatus">현재: ${theme==='trad'?'전통':'캐릭터'} 테마</p><div class="settings-row"><b>배경음악</b><button onclick="toggleMusic()" id="musicBtn">${musicOn?'ON':'OFF'}</button></div><div class="volume-row"><input aria-label="배경음악 음량" type="range" min="0" max="100" value="${Math.round(musicVolume*100)}" oninput="setVolume('music',this.value)"><output id="musicVolumeOut">${Math.round(musicVolume*100)}%</output></div><div class="settings-row"><b>효과음</b><button onclick="toggleSound()" id="soundBtn">${sound?'ON':'OFF'}</button></div><div class="volume-row"><input aria-label="효과음 음량" type="range" min="0" max="100" value="${Math.round(sfxVolume*100)}" oninput="setVolume('sfx',this.value)"><output id="sfxVolumeOut">${Math.round(sfxVolume*100)}%</output></div><div class="settings-row"><b>진동</b><button onclick="toggleVibration()" id="vibrationBtn">${vibration?'ON':'OFF'}</button></div><button onclick="closeModal()">닫기</button>`;if(which==='help')h=`<h2>📖 십이장기 도움말</h2><div class="help-tabs"><button class="active" onclick="helpTab('rules',this)">기본 규칙</button><button onclick="helpTab('ai',this)">AI 대전</button><button onclick="helpTab('online',this)">온라인 대전</button></div><div id="helpText" class="help-content"></div><button onclick="closeModal()">닫기</button>`;showCustom(h);if(which==='help')helpTab('rules',document.querySelector('.help-tabs button'));}
function setTheme(t){theme=t;document.body.className=t;localStorage.setItem('twelveTheme',t);$('themeStatus').textContent='현재: '+(t==='trad'?'전통':'캐릭터')+' 테마';render();beep();}function toggleSound(){sound=!sound;localStorage.setItem('twelveSound',sound?'on':'off');$('soundBtn').textContent=sound?'ON':'OFF';}
function toggleMusic(){musicOn=!musicOn;localStorage.setItem('twelveMusic',musicOn?'on':'off');$('musicBtn').textContent=musicOn?'ON':'OFF';if(musicOn)startMusic();else stopMusic();}
function goHome(){clearTimeout(aiTimer);if(ws){try{ws.close()}catch(e){}ws=null;}room='';state=null;finished=false;closeModal();$('home').classList.remove('hide');$('setup').classList.add('hide');$('game').classList.add('hide');$('netStatus').textContent='';}
function connect(){return new Promise((resolve,reject)=>{if(!location.host){reject(Error('온라인 대전은 서버에 배포한 뒤 사용할 수 있습니다.'));return;}if(ws&&ws.readyState===1){resolve();return;}let proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws`);ws.onopen=resolve;ws.onerror=()=>reject(Error('서버 연결 실패'));ws.onclose=()=>{if(room&&$('game').classList.contains('hide')===false){$('notice').textContent='서버 연결이 종료되었습니다.';}};ws.onmessage=e=>handleNetwork(JSON.parse(e.data));});}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o));}
async function createRoom(){try{$('netStatus').textContent='서버 연결 중...';await connect();send({type:'create',series});}catch(e){$('netStatus').textContent=e.message;}}
async function joinRoom(){try{let code=$('roomInput').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){$('netStatus').textContent='6자리 방 코드를 입력해 주세요.';return;}await connect();send({type:'join',room:code});}catch(e){$('netStatus').textContent=e.message;}}
function handleNetwork(m){if(m.type==='error'){$('netStatus').textContent=m.message;$('notice').textContent=m.message;return;}if(m.type==='created'){room=m.room;me=0;$('netStatus').textContent='친구를 기다리는 중...';$('roomCodeDisplay').textContent=room;showStep('onlineWaiting');return;}if(m.type==='joined'){room=m.room;me=1;series=m.series;return;}if(m.type==='start'){room=m.room;series=m.series;me=m.side;scores=[0,0];round=1;beginRound();return;}if(m.type==='move'){if(!state||state.turn===me)return;commitMove(m.move);return;}if(m.type==='next'){round++;closeModal();beginRound();return;}if(m.type==='left'){$('notice').textContent='상대방이 퇴장했습니다.';showCustom('<h2>상대방이 퇴장했습니다.</h2><button onclick="closeModal();goHome()">메인화면</button>');}}
</script></body></html>
